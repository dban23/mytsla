<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyTsla</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <img src="{{ url_for('static', filename='images/mytsla.png') }}" alt="MyTsla logo" class="logo">
    <div class="responsive-div">
        <div class="card">
            <h3>Basic info</h3>
            <a href="/me" class="links">Owner info</a>
            <a href="/drivers" class="links">Additional drivers</a>
            <a href="/my_vehicles" class="links">My vehicles</a>
        </div>

        <div class="card">
            <h3>Car data</h3>
            <a href="/options" class="links">Options</a>
            <a href="/specs" class="links">Specs</a>
            <a href="/warranty" class="links">Warranty details</a>
        </div>

        <div class="card">
            <h3>Service</h3>
            <a href="/service_data" class="links">Service data</a>
            <a href="/recent_alerts" class="links">Recent alerts</a>
            <a href="/release_notes" class="links">Release notes</a>
        </div>

        <div class="card">
            <h3>Charging</h3>
            <a href="/charging" class="links">SUC charging data</a>
            <a href="/monitor_charging" class="links">Monitor charging</a>
        </div>
    </div>

    <button class="tesla_login" onclick="window.location.href='/logout'">Logout</button>
  </body>
</html>
